StylesPath = .vale
MinAlertLevel = suggestion

Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.13.1/ai-tells.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.13.1/ai-tells-commits.zip

[*.md]
BasedOnStyles = ai-tells, local
ai-tells.EmDashUsage = NO
# FormalRegister: package copy off; trimmed local override applies (see .vale/local/)
ai-tells.FormalRegister = NO

[formats]
COMMIT_EDITMSG = md

[{COMMIT_EDITMSG,.git/COMMIT_EDITMSG,**/COMMIT_EDITMSG}]
BasedOnStyles = ai-tells, ai-tells-commits, local
ai-tells.EmDashUsage = NO
ai-tells.FormalRegister = NO

# Internal docs and feedback retros are factual prose; the per-instance
# tricolon rule churns on legitimate enumerations there (see the
# 2026-08-05 verbtricolon-rule-churn retro, codex-reviewed). The density
# sibling still catches clustered tricolons. Commit messages keep the
# strict tier above.
[{docs/**,feedback/**}]
ai-tells.VerbTricolon = NO

# Skills are agent-facing instructions; prose quality is not enforced here.
[**/SKILL.md]
BasedOnStyles =

# This skill intentionally contains many bad-prose examples. For changes to its
# non-example prose, lint the changed snippet through prose-lint stdin mode.
[plugins/docs/skills/humanizer/**]
BasedOnStyles =

# Rust source: only CommentSmell fires (comment-scoped narration + change
# narration). Prose rules like EmDashUsage and FormalRegister are NOT
# enabled inside code comments; they govern narrative prose (.md,
# commit messages), not source. See docs/research/2026-07-01-skills-audit-evidence/
# for the benchmark fixture and baseline output.
[*.rs]
BasedOnStyles = CommentSmell
